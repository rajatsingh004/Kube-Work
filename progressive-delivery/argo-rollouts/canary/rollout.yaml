apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-demo
  namespace: demo
spec:
  replicas: 6
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=rollout-demo-v1"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
  strategy:
    canary:
      stableService: rollout-demo-stable
      canaryService: rollout-demo-canary
      trafficRouting:
        istio:
          virtualService:
            name: rollout-demo
            routes:
              - primary
      maxSurge: 25%
      maxUnavailable: 0
      steps:
        - setWeight: 1
        - pause: { duration: 2m }
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 50
        - pause: {}
