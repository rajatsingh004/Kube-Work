apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-stable
  namespace: demo
spec:
  selector:
    app: rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: rollout-demo-canary
  namespace: demo
spec:
  selector:
    app: rollout-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rollout-demo
  namespace: demo
spec:
  hosts:
    - rollout-demo.demo.svc.cluster.local
  http:
    - name: primary
      route:
        - destination:
            host: rollout-demo-stable.demo.svc.cluster.local
            port: { number: 80 }
          weight: 100
        - destination:
            host: rollout-demo-canary.demo.svc.cluster.local
            port: { number: 80 }
          weight: 0
